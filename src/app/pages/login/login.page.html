<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="login-container">

    <h2>Bienvenido al Sistema Gestor de Ganado Lechero</h2>
    <p>Ingresa tus datos</p>

    <ion-item>    
      <ion-label position="floating">Correo electrónico</ion-label>  
        <ion-input 
          type="email"
          name="email" 
          autocomplete="off"
          [(ngModel)]="credenciales.email">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input 
        type="password" 
        name="password"
        [(ngModel)]="credenciales.password">
      </ion-input>
      
    </ion-item>

    <ion-button shape ="round" expand="block" color="secondary" (click)="login()">
      Ingresar al sistema
    </ion-button>
    <!-- <ion-button shape ="round" color="secondary" (click)="irARegistro()">
     Crear cuenta
    </ion-button>-->
    <ion-button shape ="round" color="secondary" (click)="recuperarContra()">
     Recupera tu contraseña
    </ion-button>

  </div>

</ion-content>
